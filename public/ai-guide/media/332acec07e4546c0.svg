<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">工具返回值的 Token 精简策略与可操作报错引导</title><desc id="desc">左侧对比 response_format 参数在 detailed（206 Tokens）与 concise（72 Tokens）模式下的返回内容差异；右侧对比晦涩的原始报错与自带修复示例的清晰报错。</desc>
<defs><marker id="arrow-315f9f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#315f9f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-96651e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#96651e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-6255a3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#6255a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-36765a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#36765a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-a2594e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a2594e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-262724" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#262724" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-626762" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#626762" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-e67348" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#e67348" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','STHeiti','Microsoft YaHei',sans-serif}.code{font-family:Menlo,Consolas,'PingFang SC','Hiragino Sans GB',monospace}</style>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#f8f7f4" stroke="none" stroke-width="1.5"/>
<text x="640" y="68" font-size="33" fill="#262724" font-weight="750" text-anchor="middle"><tspan x="640" dy="0">工具返回值的 Token 精简策略与可操作报错引导</tspan></text>
<rect x="32" y="106" width="1216" height="582" rx="20" fill="#fff" stroke="#e5e3dc" stroke-width="1.5"/>
<rect x="56" y="132" width="568" height="532" rx="16" fill="#edf4ff" stroke="#b2cef5" stroke-width="1.5"/>
<text x="80" y="174" font-size="23" fill="#315f9f" font-weight="700" text-anchor="start"><tspan x="80" dy="0">1. 按需控制返回详略度：response_format</tspan></text>
<text x="80" y="204" font-size="17" fill="#626762" font-weight="400" text-anchor="start"><tspan x="80" dy="0">通过枚举参数让 Agent 自主选择「带完整 ID」或「精简纯正文」</tspan></text>
<rect x="80" y="224" width="520" height="198" rx="12" fill="#fff" stroke="#b2cef5" stroke-width="1.5"/>
<rect x="96" y="240" width="268" height="28" rx="6" fill="#fff5df" stroke="#edd297" stroke-width="1.5"/>
<text x="108" y="260" font-size="15" fill="#96651e" font-weight="700" text-anchor="start" class="code"><tspan x="108" dy="0">responseFormat: &quot;detailed&quot;</tspan></text>
<text x="580" y="260" font-size="16" fill="#96651e" font-weight="700" text-anchor="end" class="code"><tspan x="580" dy="0">206 Tokens</tspan></text>
<text x="98" y="294" font-size="14.5" fill="#262724" font-weight="400" text-anchor="start" class="code"><tspan x="98" dy="0">Channel: #dev (C1234567890)</tspan><tspan x="98" dy="22">From:    @jane.doe (U123456789)</tspan><tspan x="98" dy="22">TS:      1705316445.123456</tspan><tspan x="98" dy="22">Text:    Found a critical bug in the login flow.</tspan></text>
<text x="98" y="398" font-size="15.5" fill="#315f9f" font-weight="600" text-anchor="start"><tspan x="98" dy="0">适用场景：后续还需凭 thread_ts / channel_id 调工具拉取回复串</tspan></text>
<rect x="80" y="440" width="520" height="202" rx="12" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<rect x="96" y="456" width="258" height="28" rx="6" fill="#eaf6ef" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="108" y="476" font-size="15" fill="#36765a" font-weight="700" text-anchor="start" class="code"><tspan x="108" dy="0">responseFormat: &quot;concise&quot;</tspan></text>
<text x="580" y="476" font-size="16" fill="#36765a" font-weight="700" text-anchor="end" class="code"><tspan x="580" dy="0">72 Tokens（省 ~2/3）</tspan></text>
<text x="98" y="514" font-size="14.5" fill="#262724" font-weight="400" text-anchor="start" class="code"><tspan x="98" dy="0">1. #dev - @jane.doe: Found a critical bug in</tspan><tspan x="98" dy="22">   the login flow. [Jan 15]</tspan><tspan x="98" dy="22">2. DM - @john.smith: The bug report for issue</tspan><tspan x="98" dy="22">   #123 is ready for review [Jan 14]</tspan></text>
<text x="98" y="616" font-size="15.5" fill="#36765a" font-weight="600" text-anchor="start"><tspan x="98" dy="0">适用场景：只需快速浏览消息内容，剔除冗余 ID 节省 65% Token</tspan></text>
<rect x="652" y="132" width="572" height="532" rx="16" fill="#fcfbf9" stroke="#e5e3dc" stroke-width="1.5"/>
<text x="676" y="174" font-size="23" fill="#262724" font-weight="700" text-anchor="start"><tspan x="676" dy="0">2. 截断引导与报错提示词工程</tspan></text>
<text x="676" y="204" font-size="17" fill="#626762" font-weight="400" text-anchor="start"><tspan x="676" dy="0">别甩晦涩状态码，直接告诉 Agent「错在哪、正确格式与下一步」</tspan></text>
<rect x="676" y="224" width="524" height="156" rx="12" fill="#fff0ee" stroke="#edc3bd" stroke-width="1.5"/>
<text x="696" y="254" font-size="15.5" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="696" dy="0">❌ 晦涩的原始报错：user_info(userId: &quot;john.doe@acme.corp&quot;)</tspan></text>
<text x="696" y="284" font-size="13.6" fill="#262724" font-weight="400" text-anchor="start" class="code"><tspan x="696" dy="0">{ &quot;error&quot;: { &quot;code&quot;: &quot;RESOURCE_NOT_FOUND&quot;, &quot;status&quot;: 422,</tspan><tspan x="696" dy="22">  &quot;message&quot;: &quot;Invalid value&quot;, &quot;field&quot;: &quot;userId&quot; } }</tspan></text>
<text x="696" y="356" font-size="15.5" fill="#a2594e" font-weight="400" text-anchor="start"><tspan x="696" dy="0">问题：没说明为什么邮箱无效，Agent 只能原地瞎猜或放弃</tspan></text>
<rect x="676" y="396" width="524" height="246" rx="12" fill="#eaf6ef" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="696" y="426" font-size="16.5" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="696" dy="0">✅ 自带修复指引的清晰报错 &amp; 超长截断引导</tspan></text>
<rect x="696" y="442" width="484" height="112" rx="8" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="712" y="468" font-size="14.5" fill="#262724" font-weight="400" text-anchor="start" class="code"><tspan x="712" dy="0"># Resource Not Found: Invalid `userId`</tspan><tspan x="712" dy="22">原因：`john.doe@acme.corp` 格式错误（需为纯数字 ID）</tspan><tspan x="712" dy="22">正确示例：`1928298149291729`</tspan><tspan x="712" dy="22">解决步骤：请先调用 `user_search()` 检索对应用户的数字 ID</tspan></text>
<rect x="696" y="566" width="484" height="60" rx="8" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="712" y="591" font-size="15" fill="#36765a" font-weight="650" text-anchor="start"><tspan x="712" dy="0">超长结果截断引导（如 Claude Code 默认上限 25,000 Tokens）：</tspan></text>
<text x="712" y="614" font-size="14.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="712" dy="0">展示前 N 条 + 全局汇总，并提示用 payee / minAmount 过滤或翻页</tspan></text>
</svg>
