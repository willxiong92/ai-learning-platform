<text x="640" y="68" font-size="33" fill="#262724" font-weight="750" text-anchor="middle"><tspan x="640" dy="0">与 Claude Code 协作评测并自动优化工具（附内部实测提升）</tspan></text>
<rect x="32" y="106" width="1216" height="582" rx="20" fill="#fff" stroke="#e5e3dc" stroke-width="1.5"/>
