<text x="80" y="172" font-size="22" fill="#262724" font-weight="700" text-anchor="start"><tspan x="80" dy="0">1. 编写原型 → 批量跑评测 → 分析日志自动改工具</tspan></text>
<text x="80" y="200" font-size="17" fill="#626762" font-weight="400" text-anchor="start"><tspan x="80" dy="0">把评测 Agent 的完整调用记录喂给 Claude Code 自动重构</tspan></text>
