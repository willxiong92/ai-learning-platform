<title id="title">与 Claude Code 协作评测并自动优化工具（附内部实测提升）</title><desc id="desc">左侧展示 Claude Code 编写 MCP 工具、并发运行多路评测 Agent 并根据报错日志自动修复代码的闭环；右侧展示 Slack 与 Asana 内部 MCP 工具经 Claude 优化后的测试集准确率提升。</desc>
