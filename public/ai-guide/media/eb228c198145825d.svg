<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">工具设计粒度对比：直接搬移底层 API vs. 面向 Agent 聚合工作流</title><desc id="desc">左侧反例将传统确定性系统的细碎 API 直接包装给 Agent，导致多轮调用与上下文浪费；右侧正例针对高频任务聚合成高价值工具。</desc>
<defs><marker id="arrow-315f9f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#315f9f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-96651e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#96651e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-6255a3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#6255a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-36765a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#36765a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-a2594e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a2594e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-262724" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#262724" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-626762" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#626762" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-e67348" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#e67348" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Hiragino Sans GB','STHeiti','Microsoft YaHei',sans-serif}.code{font-family:Menlo,Consolas,'PingFang SC','Hiragino Sans GB',monospace}</style>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#f8f7f4" stroke="none" stroke-width="1.5"/>
<text x="640" y="68" font-size="33" fill="#262724" font-weight="750" text-anchor="middle"><tspan x="640" dy="0">工具设计粒度对比：直接搬移底层 API vs. 面向 Agent 聚合工作流</tspan></text>
<rect x="32" y="106" width="1216" height="582" rx="20" fill="#fff" stroke="#e5e3dc" stroke-width="1.5"/>
<rect x="56" y="132" width="568" height="532" rx="16" fill="#fff0ee" stroke="#edc3bd" stroke-width="1.5"/>
<text x="80" y="174" font-size="24" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="80" dy="0">反例：直接包装传统软件底层 API</tspan></text>
<text x="80" y="204" font-size="17" fill="#626762" font-weight="400" text-anchor="start"><tspan x="80" dy="0">机械照搬确定性接口，把筛选与多步拼装负担甩给上下文窗口</tspan></text>
<rect x="80" y="224" width="520" height="98" rx="12" fill="#fff" stroke="#edc3bd" stroke-width="1.5"/>
<text x="98" y="252" font-size="16.5" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="98" dy="0">场景 A：预约团队会议</tspan></text>
<text x="98" y="279" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="98" dy="0">list_users  →  list_events  →  create_event</tspan></text>
<text x="98" y="305" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="98" dy="0">需串行调用 3 个细碎接口，中间拉取的全量日程占满上下文</tspan></text>
<rect x="80" y="336" width="520" height="98" rx="12" fill="#fff" stroke="#edc3bd" stroke-width="1.5"/>
<text x="98" y="364" font-size="16.5" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="98" dy="0">场景 B：查找联系人或排查报错日志</tspan></text>
<text x="98" y="391" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="98" dy="0">list_contacts()   /   read_logs()</tspan></text>
<text x="98" y="417" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="98" dy="0">把整本通讯录或几千行日志倒进窗口，逼模型逐 Token 暴力翻找</tspan></text>
<rect x="80" y="448" width="520" height="98" rx="12" fill="#fff" stroke="#edc3bd" stroke-width="1.5"/>
<text x="98" y="476" font-size="16.5" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="98" dy="0">场景 C：掌握客户近期完整背景</tspan></text>
<text x="98" y="503" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="98" dy="0">get_customer_by_id + list_transactions + list_notes</tspan></text>
<text x="98" y="529" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="98" dy="0">分三次查询再手动对齐，且返回大量 uuid / mime_type 等低层噪音</tspan></text>
<rect x="80" y="566" width="520" height="76" rx="12" fill="#fff" stroke="#edc3bd" stroke-width="1.5"/>
<circle cx="106" cy="604" r="12" fill="#a2594e"/>
<text x="106" y="610" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="106" dy="0">!</tspan></text>
<text x="128" y="597" font-size="18" fill="#a2594e" font-weight="700" text-anchor="start"><tspan x="128" dy="0">后果：工具过多易混淆、中间结果挤爆注意力预算</tspan></text>
<text x="128" y="624" font-size="16" fill="#626762" font-weight="400" text-anchor="start"><tspan x="128" dy="0">模型在多步串联中极易传错参数或产生幻觉</tspan></text>
<rect x="652" y="132" width="572" height="532" rx="16" fill="#eaf6ef" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="676" y="174" font-size="24" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="676" dy="0">正例：围绕高频工作流设计聚合工具</tspan></text>
<text x="676" y="204" font-size="17" fill="#626762" font-weight="400" text-anchor="start"><tspan x="676" dy="0">顺应 Agent 认知边界，把多步调用与过滤计算下沉到工具内部</tspan></text>
<rect x="676" y="224" width="524" height="98" rx="12" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="694" y="252" font-size="16.5" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="694" dy="0">场景 A：一步完成查空闲与建日程</tspan></text>
<text x="694" y="279" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="694" dy="0">schedule_event(participants, time_range, title)</tspan></text>
<text x="694" y="305" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="694" dy="0">工具在底层自动查询各方空闲并完成预定，一次调用直接闭环</tspan></text>
<rect x="676" y="336" width="524" height="98" rx="12" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="694" y="364" font-size="16.5" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="694" dy="0">场景 B：按需跳页精准检索</tspan></text>
<text x="694" y="391" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="694" dy="0">search_contacts(query)   /   search_logs(pattern)</tspan></text>
<text x="694" y="417" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="694" dy="0">像人类翻目录一样按关键词过滤，只返回命中行及前后数行上下文</tspan></text>
<rect x="676" y="448" width="524" height="98" rx="12" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<text x="694" y="476" font-size="16.5" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="694" dy="0">场景 C：一站式拉取高价值客户档案</tspan></text>
<text x="694" y="503" font-size="15.2" fill="#262724" font-weight="650" text-anchor="start" class="code"><tspan x="694" dy="0">get_customer_context(customer_id)</tspan></text>
<text x="694" y="529" font-size="15.5" fill="#626762" font-weight="400" text-anchor="start"><tspan x="694" dy="0">一次性汇总客户资料、近期交易与备注，并将乱码 UUID 转为可读名称</tspan></text>
<rect x="676" y="566" width="524" height="76" rx="12" fill="#fff" stroke="#b8d9c6" stroke-width="1.5"/>
<circle cx="702" cy="604" r="12" fill="#36765a"/>
<text x="702" y="610" font-size="16" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="702" dy="0">✓</tspan></text>
<text x="724" y="597" font-size="18" fill="#36765a" font-weight="700" text-anchor="start"><tspan x="724" dy="0">收益：精简工具集规模，把机械计算卸载回确定性代码</tspan></text>
<text x="724" y="624" font-size="16" fill="#626762" font-weight="400" text-anchor="start"><tspan x="724" dy="0">上下文始终保持清爽，显著提高复杂任务一次通过率</tspan></text>
</svg>
