<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">GPT Image 结构化提示词五要素拆解图</title>
<desc id="desc">对比模糊的一句话提示词与按画面定位、主体动作、光影材质、精确文字、硬性约束五层拆解的结构化提示词框架。</desc>
<style>
  text { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif; }
  .code { font-family: Menlo, Consolas, 'PingFang SC', monospace; }
</style>
<rect width="1280" height="740" rx="16" fill="#fcfbf7"/>
<text x="640" y="54" font-size="30" font-weight="750" fill="#18181b" text-anchor="middle">GPT Image 结构化提示词五要素拆解框架</text>
<text x="640" y="86" font-size="18" fill="#52525b" text-anchor="middle">像写产品视觉规格书（Spec）一样分层描述画面，替代靠堆砌抽象形容词“抽卡”</text>

<!-- Top anti-pattern bar -->
<rect x="40" y="110" width="1200" height="86" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<rect x="60" y="131" width="136" height="44" rx="8" fill="#e11d48"/>
<text x="128" y="159" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">反例：模糊抽卡</text>
<text x="218" y="148" font-size="18" font-weight="650" fill="#881337" class="code">"帮我生成一张超高清、电影感、高级好看的潮牌海报或 App 界面"</text>
<text x="218" y="176" font-size="16" fill="#9f1239">常见问题：靠抽象气氛词盲猜 → 构图平庸像廉价素材库、图中文字拼写错乱、多跑几次风格完全飘忽</text>

<!-- Main structured container -->
<rect x="40" y="216" width="1200" height="492" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
<rect x="40" y="216" width="1200" height="52" rx="16" fill="#eff6ff"/>
<text x="68" y="249" font-size="20" font-weight="700" fill="#1e3a8a">正例：按「五要素清单」分层组织提示词（段落、列表或键值标签均可）</text>

<!-- Pillar 1 -->
<rect x="64" y="288" width="216" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="64" y="288" width="216" height="44" rx="12" fill="#dbeafe"/>
<text x="172" y="317" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">① 画面定位与构图</text>
<text x="82" y="360" font-size="16" font-weight="650" fill="#18181b">明确交付物类型</text>
<text x="82" y="384" font-size="14.5" fill="#52525b">商业摄影 / 教学图解</text>
<text x="82" y="406" font-size="14.5" fill="#52525b">融资 PPT / 手机 UI 稿</text>
<line x1="82" y1="424" x2="262" y2="424" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="82" y="450" font-size="16" font-weight="650" fill="#18181b">机位、景别与布局</text>
<text x="82" y="474" font-size="14.5" fill="#52525b">平视近景 / 俯拍桌面</text>
<text x="82" y="496" font-size="14.5" fill="#52525b">主体居中 / 留白边距</text>
<rect x="78" y="524" width="188" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="90" y="548" font-size="12.5" font-weight="600" fill="#1d4ed8" class="code">medium close-up,</text>
<text x="90" y="568" font-size="12.5" font-weight="600" fill="#1d4ed8" class="code">eye level, 50mm lens</text>

<!-- Pillar 2 -->
<rect x="298" y="288" width="216" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="298" y="288" width="216" height="44" rx="12" fill="#e0e7ff"/>
<text x="406" y="317" font-size="18" font-weight="700" fill="#312e81" text-anchor="middle">② 主体与动作交互</text>
<text x="316" y="360" font-size="16" font-weight="650" fill="#18181b">人物姿态与视线</text>
<text x="316" y="384" font-size="14.5" fill="#52525b">全身入镜含双脚可见</text>
<text x="316" y="406" font-size="14.5" fill="#52525b">低头看书 / 背对镜头跑</text>
<line x1="316" y1="424" x2="496" y2="424" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="316" y="450" font-size="16" font-weight="650" fill="#18181b">与道具的真实接触</text>
<text x="316" y="474" font-size="14.5" fill="#52525b">双手自然握紧车把</text>
<text x="316" y="496" font-size="14.5" fill="#52525b">平静整理渔网、狗坐甲板</text>
<rect x="312" y="524" width="188" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="324" y="548" font-size="12.5" font-weight="600" fill="#4338ca" class="code">full body visible,</text>
<text x="324" y="568" font-size="12.5" font-weight="600" fill="#4338ca" class="code">adjusting a net</text>

<!-- Pillar 3 -->
<rect x="532" y="288" width="216" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="532" y="288" width="216" height="44" rx="12" fill="#fef3c7"/>
<text x="640" y="317" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">③ 材质、光线与媒介</text>
<text x="550" y="360" font-size="16" font-weight="650" fill="#18181b">表面肌理与介质</text>
<text x="550" y="384" font-size="14.5" fill="#52525b">真实皮肤毛孔 / 磨损漆面</text>
<text x="550" y="406" font-size="14.5" fill="#52525b">手绘水彩 / 35mm 胶片颗粒</text>
<line x1="550" y1="424" x2="730" y2="424" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="550" y="450" font-size="16" font-weight="650" fill="#18181b">光源方向与景深</text>
<text x="550" y="474" font-size="14.5" fill="#52525b">海岸柔和日光 / 浅景深</text>
<text x="550" y="496" font-size="14.5" fill="#52525b">摄影棚柔光 / 自然色温</text>
<rect x="546" y="524" width="188" height="66" rx="8" fill="#fffbeb" stroke="#fde68a"/>
<text x="558" y="548" font-size="12.5" font-weight="600" fill="#b45309" class="code">coastal daylight,</text>
<text x="558" y="568" font-size="12.5" font-weight="600" fill="#b45309" class="code">real skin texture</text>

<!-- Pillar 4 -->
<rect x="766" y="288" width="216" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="766" y="288" width="216" height="44" rx="12" fill="#dcfce7"/>
<text x="874" y="317" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">④ 精确文字与排版</text>
<text x="784" y="360" font-size="16" font-weight="650" fill="#18181b">引号包裹逐字原文</text>
<text x="784" y="384" font-size="14.5" fill="#52525b">把需渲染的词句放进引号</text>
<text x="784" y="406" font-size="14.5" fill="#52525b">生僻词/品牌名逐字母拼写</text>
<line x1="784" y1="424" x2="964" y2="424" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="784" y="450" font-size="16" font-weight="650" fill="#18181b">指定次数与字体字号</text>
<text x="784" y="474" font-size="14.5" fill="#52525b">声明仅出现一次（once）</text>
<text x="784" y="496" font-size="14.5" fill="#52525b">密集小字切换 high 档位</text>
<rect x="780" y="524" width="188" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="792" y="548" font-size="12.5" font-weight="600" fill="#15803d" class="code">"Yours to Create"</text>
<text x="792" y="568" font-size="12.5" font-weight="600" fill="#15803d" class="code">render exactly once</text>

<!-- Pillar 5 -->
<rect x="1000" y="288" width="216" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1000" y="288" width="216" height="44" rx="12" fill="#f3e8ff"/>
<text x="1108" y="317" font-size="18" font-weight="700" fill="#4c1d95" text-anchor="middle">⑤ 硬性约束与排除项</text>
<text x="1018" y="360" font-size="16" font-weight="650" fill="#18181b">显式声明不要什么</text>
<text x="1018" y="384" font-size="14.5" fill="#52525b">无多余文字、无水印 Logo</text>
<text x="1018" y="406" font-size="14.5" fill="#52525b">拒绝过度磨皮或电影滤镜</text>
<line x1="1018" y1="424" x2="1198" y2="424" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="1018" y="450" font-size="16" font-weight="650" fill="#18181b">透明底双重锁死</text>
<text x="1018" y="474" font-size="14.5" fill="#52525b">API 设 transparent + PNG</text>
<text x="1018" y="496" font-size="14.5" fill="#52525b">禁画灰白伪棋盘格与阴影</text>
<rect x="1014" y="524" width="188" height="66" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
<text x="1026" y="548" font-size="12.5" font-weight="600" fill="#6d28d9" class="code">no extra text, clean</text>
<text x="1026" y="568" font-size="12.5" font-weight="600" fill="#6d28d9" class="code">alpha, no checkerboard</text>

<!-- Bottom API Parameter separation bar -->
<rect x="64" y="626" width="1152" height="62" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="88" y="663" font-size="16.5" font-weight="700" fill="#854d0e">黄金准则：API 参数与提示词各司其职</text>
<text x="396" y="663" font-size="15.5" fill="#713f12">模型档位（Flare 优先速度 / Sunburst 优先画质）、尺寸（size）、质量（quality）与透明背景通过 API 独立传入</text>
</svg>
