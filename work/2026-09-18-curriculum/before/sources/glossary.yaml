# 术语卡母源。definition 用一句人话；example 均为教学模拟。
# needs = 读懂本术语前最好先懂的术语 id；section = 正文中详细讲解的位置。
version: "2026-09-16.1"
terms:
  - id: llm
    term: 大语言模型
    en: Large Language Model, LLM
    aliases: [模型, 语言模型, 大模型]
    definition: 用大量文本训练出来的程序，根据收到的输入，一段一段地生成最可能合适的后续文字。
    example: 你问“帮我写封跟进邮件”，模型根据这句话和它训练中形成的语言模式，生成一封邮件草稿。
    needs: []
    lesson: l01
    section: model
  - id: token
    term: Token
    en: Token
    aliases: [词元, 令牌]
    definition: 模型处理文字的最小单位，可能是一个词、词的一部分或一个字符。
    example: “客户跟进”可能被切成几个 Token；上下文容量和很多服务的计费都按 Token 计算。
    needs: [llm]
    lesson: l01
    section: model
  - id: app
    term: AI 应用
    en: AI Application
    aliases: [应用, AI 产品, 助手]
    definition: 你实际打开使用的软件，它负责组织输入、调用模型、连接工具，并把结果展示给你。
    example: 同一个模型可以被两个不同的 AI 应用使用，一个能读公司文档，另一个不能。
    needs: [llm]
    lesson: l01
    section: model
  - id: context
    term: 上下文
    en: Context
    aliases: [本次输入, 输入信息]
    definition: 某一次调用时，实际交给模型参考的全部信息，包括指令、材料、部分历史和工具结果。
    example: 你把一份周报贴进对话，这份周报就进入了本次上下文；没贴进去的另一份周报，模型看不到。
    needs: [llm]
    lesson: l01
    section: context
  - id: training
    term: 训练
    en: Training
    aliases: [模型训练]
    definition: 用大量数据调整模型内部参数的过程，通常由模型厂商在你使用之前完成。
    example: 在对话里贴一份产品手册不是训练，模型的参数没有因此改变；厂商用专门数据再调整模型（常叫微调），才属于训练。
    needs: [llm]
    lesson: l01
    section: context
  - id: inference
    term: 推理
    en: Inference
    aliases: [调用, 生成]
    definition: 使用已经训练好的模型，处理当前输入并生成结果的过程；你每次提问都是一次推理。
    example: 你发一条消息、AI 回一段话，这一来一回就是一次推理调用。
    needs: [training, context]
    lesson: l01
    section: context
  - id: memory
    term: 记忆
    en: Memory
    aliases: [持久记忆, 对话历史, 历史记录]
    definition: 应用把过去的信息保存下来，并在之后选择一部分重新放进上下文的功能。
    example: 应用“记住”你是客户成功负责人，是因为它保存了这条信息并在新对话里取出来，不是模型自己长了记性。
    needs: [context]
    lesson: l01
    section: context
  - id: tool
    term: 工具
    en: Tool
    aliases: [工具调用, 插件, 连接器, Function Calling]
    definition: 应用提供给模型的外部能力，例如查询记录、计算数字或读取文件，需要实际执行才会有结果。
    example: 应用接入了 CRM 查询工具，AI 才可能去查某个询盘的状态；没接入时，它只能根据你提供的文字回答。
    needs: [app, context]
    lesson: l01
    section: tools
  - id: permission
    term: 权限
    en: Permission
    aliases: [授权, 访问权限, 读写权限]
    definition: 系统允许某个账号或工具做哪些事，例如只能读取、还是可以修改。
    example: 工具能读取客户记录，不代表它能修改记录；有修改权限，也不代表这次修改成功了。
    needs: [tool]
    lesson: l01
    section: tools
  - id: hallucination
    term: 幻觉
    en: Hallucination
    aliases: [编造, AI 胡说]
    definition: 模型生成了看起来合理、但实际上不正确或没有依据的内容。
    example: 没有任何发送记录，AI 却写“报价已于周一发出”，这句话就可能是幻觉。
    needs: [llm, context]
    lesson: l01
    section: check
