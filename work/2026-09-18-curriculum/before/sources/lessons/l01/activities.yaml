# 第 01 章的结构化内容：学前说明、来源、演示、练习、测验与反馈项。
# 题目、解析、规则都在这里维护；网站只负责呈现与评分。
lesson: l01
version: "2026-09-16.1"
review_status: draft   # draft = 未经内容复核
intro:
  objectives:
    - 分清模型、应用、上下文和工具各自负责什么。
    - 解释为什么更强的模型不等于能读取公司系统。
    - 根据实际输入和工具结果，说明一份回答能支持什么结论。
  prerequisite: 无技术先修要求，有日常使用软件的经验即可。
  duration: 建议 45–60 分钟，可分两次完成（估计）
  plan: 术语与正文约 25 分钟，演示与练习约 10 分钟，测验与反馈约 15 分钟。
  simulation_note: 本章所有例子、演示和题目都是原创教学模拟，不调用 AI 模型，不连接任何真实系统，不含真实客户数据。
  scope_note: 本章讨论常见的大语言模型应用，不概括所有 AI 技术。
