demo:
  title: 同一个问题，证据逐步增加
  note: 这是预先写好的对照演示，用来理解“结论范围跟着证据走”，不是真实 AI 的实时表现。先猜一猜每一步能多说什么，再切换查看。
  steps:
    - title: 只有问题
      input: 提问“这周客户跟进怎么样？”没有附任何记录，应用也没有接入系统。
      output: 当前没有客户跟进材料，无法总结实际进展。可以先列出需要哪些信息。
      why: 会组织语言，不等于拿到了业务数据。
    - title: 补充一份记录
      input: 提供一条模拟记录：“询盘 A；状态：已报价；下一步：（空）”。没有原始沟通内容。
      output: 记录显示询盘 A 为已报价，下一步未填写。仅凭这条记录，不能确认报价实际已发出或客户已收到。
      why: 材料支持了对“记录内容”的总结，但还不能支持“实际发生了什么”的全部结论。
    - title: 再给出工具查询结果
      input: 模拟的只读工具成功返回：“询盘 A 的报价邮件已于周一发送”；没有查到客户回复记录。
      output: 工具结果显示报价邮件已于周一发送。现有结果不能证明客户已阅读或接受报价，也不能排除客户通过其他渠道回复。
      why: 证据增加，结论可以说得更多；但仍要保留查询范围和结果本身的局限。
practice:
  prompt: 换一个场景：一个“员工培训记录助手”。情况一，只告诉它“评价一下这次培训效果”；情况二，同时提供一份签到表。两种情况下，它能说出的结论有什么不同？签到表能证明所有人都学会了吗？
  placeholder: 用你自己的话写两三句即可，不需要专业术语。
  hint: 想一想：签到表属于哪一类材料？它记录的是“出席”还是“学会”？
  explanation: 情况一没有任何培训材料，助手只能给出评价框架或提醒补充信息。情况二提供了签到表，它可以总结表内的出席情况（谁来了、缺了谁）。但出席不等于理解，签到表不能证明学会；要判断学习效果，还需要测验成绩、现场讲解或实际操作等其他证据。这道题是把本章“材料决定结论范围”迁移到新场景。
  checklist:
    - 我说出了两种情况下材料的差别
    - 我说明了签到表能支持什么结论
    - 我说明了签到表不能证明什么
quiz:
  notice: 先独立作答再看解析。练习时可以回看正文；如果作答时查了资料或问了 AI，请如实勾选，这会单独记录，不影响评分。本测验是学习自测，不是防作弊考试。
  rule:
    status: draft
    min_correct: 5
    critical_required: true
    text: 首版试学规则（草案）：6 道单选至少答对 5 道，且 2 道关键题都答对，客观题才算达标；未作答的题不算对。简答不自动评分，按要点自查。本规则只用于本章学习，不是岗位认证，Will 试学后再确认。
  questions:
    - id: q1
      critical: true
      section: model
      prompt: 两个 AI 应用使用同一个模型，但只有其中一个能总结公司的客户记录。最合理的解释是？
      options:
        - text: 模型会自动识别登录者所在的公司，只对部分用户开放
          feedback: 模型不会自己识别你的公司并去读数据；能读什么由应用的连接和权限决定。
        - text: 两个应用给模型提供的材料或接入的工具不同
          feedback: ""
        - text: 能总结记录的那个应用，回答写得更长更详细
          feedback: 回答长短和能不能读取数据没有关系；读取依赖材料或工具连接。
      answer: 1
      reason: 模型相同，不代表应用提供的上下文、工具和权限相同。
    - id: q2
      section: context
      prompt: 你把一份产品说明粘贴进对话，让 AI 按说明回答问题。这一步主要改变了什么？
      options:
        - text: 这一次调用的上下文（本次输入）
          feedback: ""
        - text: 模型的参数，它以后都会记得这份说明
          feedback: 粘贴材料不是训练，模型参数没有改变。之后能否用到，取决于应用是否再次提供。
        - text: 公司数据库里的产品说明已经同步更新
          feedback: 对话里的文字不会写入公司数据库；那需要应用实际调用有写权限的工具。
      answer: 0
      reason: 提供材料改变的是本次输入，不等于训练模型，也不等于更新数据库。
    - id: q3
      section: context
      prompt: 昨天在另一个对话里上传过一份文件，今天新开了一个对话。关于这份文件，哪种理解正确？
      options:
        - text: 上传过就一定会被记住，新对话里也能读到全文
          feedback: 保存、取回、送入模型是三个环节，任何一个没发生，这次都看不到。
        - text: 新对话一定完全读不到，任何应用都一样
          feedback: 有的应用有文件或记忆机制，可能会带上；不能一概而论。
        - text: 能不能读到，取决于应用是否保存、取回并提供了它
          feedback: ""
      answer: 2
      reason: “历史里出现过”“文件被保存了”“这次调用实际用了它”是不同的状态。
    - id: q4
      section: check
      prompt: 一份 AI 回答措辞非常专业，没有任何语病。能否据此确认其中的业务事实？
      options:
        - text: 不能，仍要核对它依据的材料和来源
          feedback: ""
        - text: 能，语言专业说明模型认真检查过内容
          feedback: 流畅和专业是生成能力的表现，不代表每个事实都被核验过。
        - text: 能，只要所用的模型参数规模足够大
          feedback: 模型更大可能整体表现更好，但仍可能产生幻觉，不能替代核对。
      answer: 0
      reason: 生成流畅的语言，不等于对其中每个事实做过核验。
    - id: q5
      critical: true
      section: tools
      prompt: 你输入“你是 CRM 专家，请查询客户 A 的状态”，但这个应用没有接入 CRM。哪项说法正确？
      options:
        - text: 设定了专家角色后，应用会自动获得查询权限
          feedback: 角色描述只是输入里的文字，不会建立系统连接，也不会授予权限。
        - text: 只要指令写得足够明确，模型就能读到 CRM 数据
          feedback: 指令再清楚，没有连接就没有数据来源；模型只能根据已有输入生成。
        - text: 需要应用接入 CRM、具备权限，并实际调用成功才能查到
          feedback: ""
      answer: 2
      reason: 文字指令不能替代系统连接、权限和实际调用。
    - id: q6
      section: tools
      prompt: 一个只读工具返回“报价邮件已发送”。基于这个结果，目前能直接支持的判断是？
      options:
        - text: 客户已经收到并同意了这份报价
          feedback: 发送记录不能证明对方已阅读或同意，这需要其他证据。
        - text: 该工具查到的记录显示报价邮件已发送
          feedback: ""
        - text: 客户没有通过其他任何渠道回复过
          feedback: 这个工具只查了发送记录，不能排除其他渠道的回复。
      answer: 1
      reason: 结论要停在证据所在的那一层：发送记录只能支持“记录显示已发送”。
  short_question:
    prompt: 用自己的话说明：为什么两个使用同一个模型的 AI 应用，可能给出不同的业务答案？请联系“材料”和“工具”各举一个例子。
    placeholder: 例如从“给了什么材料”“接了什么工具”两个角度写，三到五句即可。
    rubric:
      - 区分了模型的生成能力和应用提供的完整流程
      - 用例子说明本次材料会影响回答，训练知识不等于实时业务事实
      - 用例子说明工具需要连接、权限、实际调用，结果仍要核验
    rubric_note: 简答不自动评分，也不按字数判断。请对照三条要点逐条自查，如实勾选；你参与过教材编写，熟悉答案不等于能迁移到新场景，后续会用未见过的变式题再验证。
feedback:
  intro: 这里记录“这一章教材本身好不好学”，和你的测验成绩分开保存。保存反馈不会发布课程，也不会改变团队开放状态。
  checks:
    - 我能说清本章核心概念之间的关系
    - 图例、演示和练习帮助我理解
    - 我已按要点自查过自己的简答
  verdicts:
    - value: revise
      label: 需要修订后再试学
    - value: ready
      label: 建议进入内容复核（之后再安排团队试用）
  ready_requires: 选择“建议进入内容复核”前，需要：标记已读、完成测验且客观题达标、完成简答自查、勾选全部三项检查。
